[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socialsim"
version = "0.1.0"
description = "Stochastic adaptive multiplex model of opinion dynamics with Brownian agents"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "networkx",
]

[project.optional-dependencies]
video = ["manim"]

[tool.setuptools.packages.find]
where = ["src"]
